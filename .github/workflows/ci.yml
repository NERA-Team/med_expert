name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Verify database and build Android/Desktop
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: parser/requirements.txt

      - name: Install parser dependencies
        run: python -m pip install -r parser/requirements.txt

      - name: Verify bundled SQLite database
        run: python parser/parse_docx.py --verify

      - name: Compile desktop and build Android debug APK
        run: ./gradlew :composeApp:compileKotlinDesktop :androidApp:assembleDebug

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: medexpert-android-debug
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  build-ios:
    name: Build iOS Simulator framework
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build iOS Simulator target
        run: ./gradlew :composeApp:compileKotlinIosSimulatorArm64
